env:
  vars:
    CGO_ENABLED: 0

tasks:
  default:
    passthru: true
    cmds:
      - task: go:fmt
      - task: go:test
      - task: docs
      - go install ./cmd/...

  docs:
    desc: "Generate the API reference into docs/api.md"
    cmds:
      - defer: rm -f splint-doc.json go-fsck.json
      # Extracted without -r, so the reference holds the importable package
      # and not the command or the internal ones.
      - splint -include-sources -output splint-doc.json . || true
      - jq '.Packages' splint-doc.json > go-fsck.json
      - go-fsck docs > docs/api.md
